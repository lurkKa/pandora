name: Render and Backup

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate secrets
        env:
          PANDORA_BASE_URL: ${{ secrets.PANDORA_BASE_URL }}
          PANDORA_BACKUP_USER: ${{ secrets.PANDORA_BACKUP_USER }}
          PANDORA_BACKUP_PASS: ${{ secrets.PANDORA_BACKUP_PASS }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${PANDORA_BASE_URL:-}" ] || { echo "::error::Missing secret PANDORA_BASE_URL"; missing=1; }
          [ -n "${PANDORA_BACKUP_USER:-}" ] || { echo "::error::Missing secret PANDORA_BACKUP_USER"; missing=1; }
          [ -n "${PANDORA_BACKUP_PASS:-}" ] || { echo "::error::Missing secret PANDORA_BACKUP_PASS"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Preflight ping
        env:
          PANDORA_BASE_URL: ${{ secrets.PANDORA_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${PANDORA_BASE_URL%/}"
          echo "Checking ${BASE}/ping"
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 "${BASE}/ping" > /dev/null

      - name: Prepare backup path
        run: |
          mkdir -p backups
          echo "BACKUP_FILE=backups/academy_backup_$(date -u +'%Y%m%dT%H%M%SZ').db.gz" >> "$GITHUB_ENV"

      - name: Pull backup from Render
        env:
          PANDORA_BASE_URL: ${{ secrets.PANDORA_BASE_URL }}
          PANDORA_BACKUP_USER: ${{ secrets.PANDORA_BACKUP_USER }}
          PANDORA_BACKUP_PASS: ${{ secrets.PANDORA_BACKUP_PASS }}
        run: |
          python3 scripts/render_backup_pull.py \
            --base-url "$PANDORA_BASE_URL" \
            --username "$PANDORA_BACKUP_USER" \
            --password "$PANDORA_BACKUP_PASS" \
            --output "$BACKUP_FILE"

      - name: Publish backup branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Сохраняем новый бэкап во временную папку
          BACKUP_BASENAME=$(basename "$BACKUP_FILE")
          TMP_DIR="$(mktemp -d)"
          cp "$BACKUP_FILE" "$TMP_DIR/$BACKUP_BASENAME"

          # Переключаемся на ветку backup-snapshots
          git fetch origin backup-snapshots || true
          if git ls-remote --exit-code --heads origin backup-snapshots >/dev/null 2>&1; then
            git checkout backup-snapshots
          else
            git checkout --orphan backup-snapshots
            git rm -rf . || true
          fi

          # Каждый коммит содержит только ОДИН файл бэкапа
          rm -rf backups
          mkdir -p backups
          cp "$TMP_DIR/$BACKUP_BASENAME" "backups/$BACKUP_BASENAME"

          printf "# Backup Branch\n\nAuto-generated SQLite snapshots.\nEach commit contains exactly one backup file.\nLast 20 commits are retained.\n" > README.md

          git add -f backups README.md
          git commit -m "backup: $(date -u +'%Y-%m-%d %H:%M UTC') — $BACKUP_BASENAME" || {
            echo "No changes to commit"
            exit 0
          }

          # Обрезаем историю: оставляем только 20 последних коммитов
          MAX_KEEP=20
          COMMITS=$(git rev-list --count HEAD)
          echo "Total commits: $COMMITS (max keep: $MAX_KEEP)"

          if [ "$COMMITS" -gt "$MAX_KEEP" ]; then
            echo "Pruning old commits..."
            # Находим коммит, который станет новым корнем (20-й с конца)
            NEW_ROOT_REF=$(git rev-list HEAD | sed -n "${MAX_KEEP}p")
            NEW_ROOT_TREE=$(git rev-parse "${NEW_ROOT_REF}^{tree}")
            SYNTHETIC_ROOT=$(git commit-tree "$NEW_ROOT_TREE" -m "base (truncated history)")
            git rebase --onto "$SYNTHETIC_ROOT" "$NEW_ROOT_REF" HEAD
            git push -f origin backup-snapshots
          else
            git push origin backup-snapshots
          fi
