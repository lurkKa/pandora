name: Render and Backup

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов (пример)
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run backup script
        run: |
          # Здесь запускается ваш основной скрипт, 
          # который создает json-файлы или папку backups
          python main.py 

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. Принудительно добавляем папку backups, даже если она в .gitignore
          git add -f backups/ || true
          
          # 2. Добавляем все новые json-файлы бэкапов в корне
          git add *_backup_*.json || true
          git add *.db || true
          
          # 3. Проверяем, есть ли что коммитить, чтобы не было ошибки "nothing to commit"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Auto-backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin backup-snapshots
