services:
  - type: web
    name: pandora-academy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /ping
    envVars:
      - key: PANDORA_JWT_SECRET
        generateValue: true
      - key: PANDORA_REVIEW_ONLY_MODE
        value: "0"
      - key: PANDORA_FORCE_AUTOCHECK
        value: "1"
      - key: PANDORA_RUNNER_MODE
        value: "local"
      - key: PANDORA_STRICT_DOCKER_RUNNERS
        value: "0"
      - key: PANDORA_ALLOW_UNSAFE_LOCAL_RUNNERS
        value: "1"
      - key: PANDORA_LOW_RESOURCE_MODE
        value: "1"
      - key: PANDORA_SKIP_AUTOCHECK_REVIEWABLE_ON_LOW_RESOURCE
        value: "1"
      - key: PANDORA_MANUAL_REVIEW_FOR_REVIEWABLE_TIERS
        value: "0"
      - key: PANDORA_STATELESS_AUTH
        value: "1"
      - key: PANDORA_SQLITE_TIMEOUT_S
        value: "30"
      - key: PANDORA_SQLITE_BUSY_TIMEOUT_MS
        value: "15000"
      - key: PANDORA_LOG_MAX_BYTES
        value: "1048576"
      - key: PANDORA_LOG_BACKUP_COUNT
        value: "2"
      - key: PANDORA_SECURITY_LOG_BACKUP_COUNT
        value: "3"
      - key: PANDORA_LOGIN_RATE_LIMIT
        value: "5/minute"
      - key: PANDORA_RUNNER_CONCURRENCY
        value: "1"
      - key: PANDORA_ACTIVE_TASK_ATTEMPT_TTL_S
        value: "25"
      - key: PANDORA_MAX_CODE_CHARS
        value: "20000"
      - key: PANDORA_EXTRA_REVIEW_SAMPLE_RATE
        value: "0"
      - key: PANDORA_QUIZ_BANK_MAX_ITEMS
        value: "2500"
      - key: PANDORA_BOOTSTRAP_ADMIN_USER
        value: "admin"
      - key: PANDORA_BOOTSTRAP_ADMIN_DISPLAY
        value: "Sensei"
      - key: PANDORA_AUTH_TRACE
        value: "0"
