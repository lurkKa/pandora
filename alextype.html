<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlexType — Тренажёр печати</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #08080c;
      --bg-deep: #0e0e14;
      --bg-surface: #14141c;
      --bg-elevated: #1a1a24;
      --bg-hover: #222230;

      --text-bright: #f5f5f7;
      --text-primary: #e0e0e5;
      --text-secondary: #9898a8;
      --text-muted: #6a6a78;

      --accent: #8b5cf6;
      --accent-soft: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.3);

      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.15);
      --warning: #fbbf24;
      --danger: #f87171;

      --border: rgba(139, 92, 246, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px 16px;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(52, 211, 153, 0.05) 0%, transparent 50%);
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    /* ===== HEADER ===== */
    .header-card {
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--success), var(--warning));
      opacity: 0.7;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-soft) 0%, var(--text-bright) 50%, var(--success) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo-sub {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 6px;
      margin-left: 54px;
    }

    /* ===== BACK LINK ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent-soft);
    }

    /* ===== CARDS ===== */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: var(--border);
    }

    /* ===== CONTROLS ===== */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    select {
      background: var(--bg-deep);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--bg-hover);
      border-color: var(--border);
      transform: translateY(-1px);
    }

    button.primary {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.1));
      border-color: rgba(139, 92, 246, 0.4);
      color: var(--accent-soft);
    }

    button.primary:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.15));
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .status {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-left: auto;
    }

    /* ===== TYPING AREA ===== */
    .sample {
      line-height: 1.75;
      font-size: 17px;
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      min-height: 100px;
      white-space: pre-wrap;
      font-family: 'Inter', monospace;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }

    .sample .ok {
      color: var(--success);
      text-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
    }

    .sample .bad {
      color: var(--danger);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-shadow: 0 0 8px rgba(248, 113, 113, 0.3);
    }

    .sample .rest {
      color: var(--text-muted);
    }

    .sample .cursor-char {
      color: var(--text-bright);
      background: rgba(139, 92, 246, 0.25);
      border-radius: 2px;
      padding: 0 1px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      background: var(--bg-deep);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 16px;
      font-family: 'Inter', monospace;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      letter-spacing: 0.2px;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: center;
      transition: border-color 0.3s, transform 0.2s;
    }

    .stat:hover {
      border-color: var(--border);
      transform: translateY(-2px);
    }

    .stat-label {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .stat-value {
      display: block;
      color: var(--text-bright);
      font-size: 22px;
      font-weight: 700;
    }

    .stat:nth-child(1) .stat-value {
      color: var(--accent-soft);
    }

    .stat:nth-child(2) .stat-value {
      color: var(--success);
    }

    .stat:nth-child(3) .stat-value {
      color: var(--warning);
    }

    .stat:nth-child(4) .stat-value {
      color: var(--text-bright);
    }

    .status-ok {
      color: var(--success) !important;
      font-weight: 600;
    }

    .status-bad {
      color: var(--danger) !important;
      font-weight: 600;
    }

    /* ===== XP TOAST ===== */
    .xp-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(109, 40, 217, 0.9));
      border: 1px solid rgba(139, 92, 246, 0.6);
      border-radius: var(--radius-md);
      padding: 16px 24px;
      color: var(--text-bright);
      font-weight: 700;
      font-size: 18px;
      z-index: 9999;
      animation: xpSlideIn 0.4s ease-out, xpFadeOut 0.4s ease-in 2.6s forwards;
      box-shadow: 0 0 30px var(--accent-glow), 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    .xp-toast .xp-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-soft);
      margin-top: 4px;
    }

    @keyframes xpSlideIn {
      from {
        transform: translateX(100px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes xpFadeOut {
      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    .xp-preview {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: auto;
      padding: 4px 10px;
      background: var(--bg-deep);
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    /* ===== LEVEL BADGE ===== */
    .level-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .level-badge.D {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .level-badge.C {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .level-badge.B {
      background: rgba(168, 85, 247, 0.15);
      color: #a855f7;
    }

    .level-badge.A {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
    }

    .level-badge.S {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(245, 158, 11, 0.15));
      color: #f43f5e;
    }

    /* ===== RESPONSIVE — Ideal adaptation for any device ===== */

    /* Tablet landscape & small desktop */
    @media (max-width: 960px) {
      .wrap {
        max-width: 720px;
      }
    }

    /* Tablet portrait */
    @media (max-width: 768px) {
      body {
        padding: 16px 12px;
      }

      .wrap {
        gap: 12px;
      }

      .header-card {
        padding: 18px 20px;
      }

      .logo h1 {
        font-size: 22px;
      }

      .logo-sub {
        font-size: 12px;
        margin-left: 54px;
      }

      .controls {
        gap: 8px;
      }

      select,
      button {
        padding: 10px 14px;
        font-size: 13px;
      }

      .sample {
        font-size: 16px;
        padding: 14px;
        min-height: 90px;
      }

      textarea {
        font-size: 15px;
        padding: 14px;
        min-height: 90px;
      }

      .stat-value {
        font-size: 20px;
      }
    }

    /* Large phones */
    @media (max-width: 640px) {
      body {
        padding: 12px 8px;
        /* Safe area for notched phones */
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      .wrap {
        gap: 10px;
      }

      .header-card {
        padding: 14px 16px;
        border-radius: var(--radius-md);
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: var(--radius-sm);
      }

      .logo h1 {
        font-size: 20px;
      }

      .logo-sub {
        margin-left: 48px;
        font-size: 11px;
        line-height: 1.4;
      }

      .card {
        padding: 14px;
        border-radius: var(--radius-md);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .controls select,
      .controls button {
        width: 100%;
        min-height: 44px;
        /* Touch-friendly minimum */
        font-size: 14px;
        justify-content: center;
        text-align: center;
      }

      .controls button.primary {
        grid-column: 1 / -1;
        /* Full width */
      }

      .level-badge {
        justify-self: start;
      }

      .status {
        grid-column: 1 / -1;
        margin-left: 0;
        width: 100%;
        text-align: center;
        padding: 6px 0;
      }

      .xp-preview {
        display: none;
      }

      .sample {
        font-size: 15px;
        padding: 12px;
        min-height: 80px;
        line-height: 1.7;
        border-radius: var(--radius-sm);
      }

      textarea {
        font-size: 16px;
        /* Prevent iOS zoom on focus */
        padding: 12px;
        min-height: 80px;
        border-radius: var(--radius-sm);
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 12px;
        border-radius: var(--radius-sm);
      }

      .stat-value {
        font-size: 20px;
      }

      .stat-label {
        font-size: 10px;
        letter-spacing: 0.6px;
      }

      /* XP toast: full width on mobile */
      .xp-toast {
        left: 12px;
        right: 12px;
        top: 12px;
        text-align: center;
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        font-size: 16px;
      }

      .back-link {
        font-size: 12px;
        margin-bottom: 2px;
      }
    }

    /* Small phones (iPhone SE, Galaxy S series) */
    @media (max-width: 480px) {
      body {
        padding: 8px 6px;
        padding-left: max(6px, env(safe-area-inset-left));
        padding-right: max(6px, env(safe-area-inset-right));
      }

      .header-card {
        padding: 12px 14px;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

      .logo h1 {
        font-size: 18px;
      }

      .logo-sub {
        margin-left: 44px;
        font-size: 10px;
      }

      .card {
        padding: 10px;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .controls select,
      .controls button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .sample {
        font-size: 14px;
        padding: 10px;
        min-height: 70px;
        line-height: 1.65;
      }

      textarea {
        font-size: 16px;
        /* Keep 16px to prevent iOS zoom */
        padding: 10px;
        min-height: 70px;
      }

      .stats {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .stat {
        padding: 8px 4px;
      }

      .stat-value {
        font-size: 16px;
      }

      .stat-label {
        font-size: 9px;
        letter-spacing: 0.4px;
        margin-bottom: 4px;
      }
    }

    /* Very small phones (320-360px) */
    @media (max-width: 360px) {
      .logo h1 {
        font-size: 16px;
      }

      .logo-sub {
        display: none;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .sample {
        font-size: 13px;
        padding: 8px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-value {
        font-size: 18px;
      }
    }

    /* Landscape phones — maximize typing area */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 8px 16px;
      }

      .wrap {
        gap: 8px;
      }

      .header-card {
        padding: 8px 16px;
      }

      .header-card::before {
        height: 1px;
      }

      .logo-icon {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .logo h1 {
        font-size: 18px;
      }

      .logo-sub {
        display: none;
      }

      .card {
        padding: 10px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .controls select,
      .controls button {
        padding: 6px 12px;
        min-height: 36px;
        font-size: 12px;
      }

      .sample {
        font-size: 14px;
        min-height: 50px;
        padding: 8px 12px;
      }

      textarea {
        min-height: 50px;
        padding: 8px 12px;
        font-size: 14px;
      }

      .stats {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .stat {
        padding: 6px 8px;
      }

      .stat-value {
        font-size: 16px;
      }

      .stat-label {
        font-size: 9px;
        margin-bottom: 2px;
      }

      .back-link {
        display: none;
      }
    }

    /* Large desktop / ultra-wide */
    @media (min-width: 1200px) {
      .wrap {
        max-width: 900px;
      }

      .sample {
        font-size: 18px;
        padding: 20px;
      }

      textarea {
        font-size: 17px;
        padding: 20px;
      }
    }

    /* Hover-capable devices only — remove hover effects on touch */
    @media (hover: none) {
      .stat:hover {
        transform: none;
        border-color: var(--border-subtle);
      }

      button:hover {
        transform: none;
      }

      .card:hover {
        border-color: var(--border-subtle);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <a href="/" class="back-link">← Вернуться в Академию</a>

    <div class="header-card">
      <div class="logo">
        <div class="logo-icon">⌨️</div>
        <h1>AlexType</h1>
      </div>
      <div class="logo-sub">Тренажёр печати Академии Pandora — уровни сложности, точность и скорость → XP</div>
    </div>

    <div class="card controls">
      <label for="level" style="font-weight:600;font-size:14px;">Уровень:</label>
      <select id="level">
        <option value="D">D — Новичок</option>
        <option value="C">C — Ученик</option>
        <option value="B">B — Воин</option>
        <option value="A">A — Мастер</option>
        <option value="S">S — Легенда</option>
      </select>
      <select id="lang">
        <option value="ru">🇷🇺 Русский</option>
        <option value="en">🇬🇧 English</option>
      </select>
      <span id="levelBadge" class="level-badge D">D</span>
      <button id="newText" class="primary">✨ Новый текст</button>
      <button id="reset">🔄 Сброс</button>
      <span id="xpPreview" class="xp-preview">~5-8 XP</span>
      <span id="status" class="status">Готово к старту</span>
    </div>

    <div class="card">
      <div id="sample" class="sample"></div>
      <textarea id="input" placeholder="Начни печатать здесь..." autocomplete="off" spellcheck="false"></textarea>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Символы</span>
        <span class="stat-value" id="chars">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Точность</span>
        <span class="stat-value" id="accuracy">100%</span>
      </div>
      <div class="stat">
        <span class="stat-label">CPM</span>
        <span class="stat-value" id="cpm">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Время</span>
        <span class="stat-value" id="time">0s</span>
      </div>
    </div>
  </div>

  <script>
    // ===== TEXT POOLS BY DIFFICULTY & LANGUAGE =====
    // D: ~30 chars | C: ~80-100 chars | B: ~180-200 chars | A: ~350-400 chars | S: ~700-800 chars
    const TEXTS = {
      ru: {
        D: [
          "Привет мир, как дела сегодня?",
          "Добрый день, рад вас видеть.",
          "Скоро лето, будет тепло и хорошо.",
          "Чистый код работает без ошибок.",
          "Книга лежит на столе у окна.",
          "Солнце светит ярко над городом.",
          "Я люблю учиться каждый новый день.",
          "Код работает правильно и быстро.",
          "Программа запущена без проблем.",
          "Тест пройден, все модули в норме.",
          "Дождь идет за окном, тепло внутри.",
          "Кот спит на диване, тихо мурча.",
          "Весна пришла, деревья зеленеют.",
          "Утро начинается с чашки кофе.",
          "Задача решена, можно двигаться дальше.",
          "Мышка и клавиатура - инструменты мастера.",
          "Ветер дует с севера, холодно на улице.",
          "Музыка играет тихо, приятно работать.",
          "Друзья всегда помогут в трудный час.",
          "Новый проект начинается с идеи.",
        ],

          "Containerization with Docker allows packaging an application with all its dependencies and running it in any environment. A Dockerfile describes the steps for building an image, docker-compose manages multi-container applications. Images are stored in registries and can be deployed to any server with Docker installed. This solves the problem of environment incompatibility between development and production. Container orchestration with Kubernetes adds automatic scaling, load balancing, and self-healing capabilities. Pods, Services, Deployments, ConfigMaps - each Kubernetes primitive solves a specific problem. Helm charts simplify the deployment of complex applications. But behind the power lies complexity: network policies, persistent volumes, resource limits, liveness probes - everything requires deep understanding and careful configuration.",
          "Continuous integration and deployment automate the process of testing and delivering code to production. With each commit, a pipeline runs: linting, unit tests, integration tests, artifact building, deployment to staging, smoke tests, and finally release to production. Blue-green deployment allows switching between versions without downtime. Canary releases direct a portion of traffic to the new version for verification before full rollout. Feature flags enable gradual enablement of functionality. Monitoring and alerts track system health in real-time. Prometheus collects metrics, Grafana visualizes them, PagerDuty notifies on-call engineers of critical issues. Logs are aggregated using the ELK stack or Loki for centralized search and analysis. Distributed tracing through Jaeger helps find bottlenecks in microservice chains.",
          "Web application security begins with understanding the main threats that exist in the modern internet landscape. SQL injection allows an attacker to execute arbitrary database queries when input data is not properly validated and sanitized. Cross-Site Scripting injects malicious JavaScript into pages viewed by other users. CSRF forces a user's browser to perform unwanted actions on a site where they are authenticated. Protection includes parameterized queries, output escaping, CSRF tokens, Content Security Policy headers, and Strict-Transport-Security. Authentication via JWT tokens requires proper secret storage, key rotation, and claims validation. OAuth2 and OpenID Connect standardize the authorization process through external identity providers. Two-factor authentication adds a second layer of protection. Rate limiting prevents brute-force attacks against login endpoints.",
          "Algorithms and data structures form the foundation of computer science and software engineering. Arrays provide constant-time access by index, but insertion in the middle requires shifting elements. Linked lists allow fast insertion at any position, but searching is linear in the worst case. Hash tables provide amortized constant-time access at the cost of additional memory usage. Binary search trees maintain sorted data with logarithmic operations for insert, delete, and search. Graphs model relationships between objects; BFS and DFS traverse them in different ways, each suited to specific problems. Dynamic programming breaks a problem into subproblems and memoizes results to avoid redundant computation. Greedy algorithms make locally optimal choices hoping for a global optimum. Sorting: quicksort on average runs in O(n log n), mergesort is stable, heapsort requires no additional memory allocation.",
        ],
      },
    };

    const XP_PREVIEW = { D: "~4-7", C: "~12-18", B: "~30-42", A: "~55-83", S: "~110-180" };
    const API_URL = window.location.origin;

    function getAuthToken() {
      return localStorage.getItem("auth_token") || "";
    }

    const levelEl = document.getElementById("level");
    const langEl = document.getElementById("lang");
    const badgeEl = document.getElementById("levelBadge");
    const sampleEl = document.getElementById("sample");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");
    const charsEl = document.getElementById("chars");
    const accuracyEl = document.getElementById("accuracy");
    const cpmEl = document.getElementById("cpm");
    const timeEl = document.getElementById("time");
    const xpPreviewEl = document.getElementById("xpPreview");

    let targetText = "";
    let startedAt = 0;
    let timer = null;
    let rewardSent = false;
    let typingTelemetry = null;
    let _lastInputValue = "";
    let _pendingInputMeta = null;

    function textFingerprint(value) {
      // Context binding only (not a secret and not used as proof of content).
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16).padStart(8, "0");
    }

    function createServerTypingTelemetry(startPayload) {
      const state = {
        sessionId: null,
        receipt: null,
        sequence: 1,
        queue: [],
        lastEventAt: 0,
        startedAt: performance.now(),
        timer: null,
        failed: false,
        inFlight: Promise.resolve(),
        ready: null,
      };

      const token = getAuthToken();
      state.ready = token
        ? fetch(`${API_URL}/api/typing/session/start`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify(startPayload),
        }).then(async (response) => {
          if (!response.ok) throw new Error(`telemetry start ${response.status}`);
          const payload = await response.json();
          state.sessionId = payload.session_id;
          state.receipt = payload.receipt;
          return true;
        }).catch((error) => {
          state.failed = true;
          console.warn("Typing telemetry unavailable:", error);
          return false;
        })
        : Promise.resolve(false);

      state.flush = function (force = false) {
        if (state.timer) {
          clearTimeout(state.timer);
          state.timer = null;
        }
        state.inFlight = state.inFlight.then(async () => {
          const ready = await state.ready;
          if (!ready || state.failed) return;
          do {
            if (!state.queue.length) return;
            const batch = state.queue.splice(0, 32);
            try {
              const response = await fetch(
                `${API_URL}/api/typing/session/${encodeURIComponent(state.sessionId)}/events`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${getAuthToken()}`,
                  },
                  body: JSON.stringify({
                    sequence: state.sequence,
                    receipt: state.receipt,
                    events: batch,
                    client_elapsed_ms: Math.max(0, Math.round(performance.now() - state.startedAt)),
                  }),
                },
              );
              if (!response.ok) throw new Error(`telemetry batch ${response.status}`);
              const payload = await response.json();
              state.receipt = payload.receipt;
              state.sequence = payload.next_sequence;
            } catch (error) {
              state.queue.unshift(...batch);
              state.failed = true;
              console.warn("Typing telemetry batch failed:", error);
              return;
            }
          } while (force && state.queue.length);
        });
        return state.inFlight;
      };

      state.record = function (kind, chars, trusted) {
        if (state.failed) return;
        const now = performance.now();
        const dt = state.lastEventAt ? Math.min(60000, Math.max(0, Math.round(now - state.lastEventAt))) : 0;
        state.lastEventAt = now;
        state.queue.push({
          kind,
          dt_ms: dt,
          chars: Math.min(4096, Math.max(0, Number(chars) || 0)),
          trusted: Boolean(trusted),
        });
        // Establish a server timestamp on the first input.  Later batches are
        // bounded by count and a short timer.
        if (state.sequence === 1 && state.queue.length === 1) {
          state.flush(false);
        } else if (state.queue.length >= 16) {
          state.flush(false);
        } else if (!state.timer) {
          state.timer = setTimeout(() => state.flush(false), 1200);
        }
      };

      state.credentials = () => ({
        typing_session_id: state.sessionId,
        typing_receipt: state.receipt,
      });
      return state;
    }

    function pickText() {
      const lang = langEl.value || "ru";
      const pool = (TEXTS[lang] || TEXTS.ru)[levelEl.value] || (TEXTS[lang] || TEXTS.ru).D;
      targetText = pool[Math.floor(Math.random() * pool.length)];
      inputEl.value = "";
      _lastInputValue = "";
      _pendingInputMeta = null;
      _keystrokeCount = 0;
      _voiceBlockCount = 0;
      _lastKeydownTime = 0;
      _lastKeydownTrusted = false;
      _recentInsertTimes.length = 0;
      startedAt = 0;
      clearInterval(timer);
      timer = null;
      rewardSent = false;
      typingTelemetry = createServerTypingTelemetry({
        scope: "alextype",
        level: levelEl.value,
        text_length: targetText.length,
        content_hash: textFingerprint(targetText),
      });
      renderSample();
      setStats();
      setStatus("Готово к старту", "");
      updateBadge();
      updateXPPreview();
      inputEl.focus();
    }

    function updateBadge() {
      const lv = levelEl.value;
      badgeEl.textContent = lv;
      badgeEl.className = `level-badge ${lv}`;
    }

    function updateXPPreview() {
      const lv = levelEl.value;
      xpPreviewEl.textContent = `${XP_PREVIEW[lv] || "~5"} XP`;
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = `status ${cls || ""}`.trim();
    }

    function renderSample() {
      const typed = inputEl.value;
      let ok = "";
      let bad = "";
      let i = 0;
      while (i < typed.length && i < targetText.length && typed[i] === targetText[i]) {
        ok += targetText[i];
        i++;
      }
      if (i < typed.length && i < targetText.length) bad = targetText[i];
      const cursorIdx = i + (bad ? 1 : 0);
      const cursorChar = cursorIdx < targetText.length ? targetText[cursorIdx] : '';
      const rest = targetText.slice(cursorIdx + (cursorChar ? 1 : 0));

      sampleEl.innerHTML =
        `<span class="ok">${esc(ok)}</span>` +
        `<span class="bad">${esc(bad)}</span>` +
        (cursorChar ? `<span class="cursor-char">${esc(cursorChar)}</span>` : '') +
        `<span class="rest">${esc(rest)}</span>`;
    }

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function getAccuracy() {
      const typed = inputEl.value;
      const total = typed.length;
      let correct = 0;
      for (let i = 0; i < total; i++) {
        if (typed[i] === targetText[i]) correct++;
      }
      return total > 0 ? correct / total : 1;
    }

    function setStats() {
      const typed = inputEl.value;
      const total = typed.length;
      let correct = 0;
      for (let i = 0; i < total; i++) {
        if (typed[i] === targetText[i]) correct++;
      }
      const elapsedMs = startedAt ? Date.now() - startedAt : 0;
      const elapsedMin = elapsedMs > 0 ? (elapsedMs / 60000) : 0;
      const cpm = elapsedMin > 0 ? Math.round(correct / elapsedMin) : 0;
      const acc = total > 0 ? Math.round((correct / total) * 100) : 100;

      charsEl.textContent = String(total);
      accuracyEl.textContent = `${acc}%`;
      cpmEl.textContent = String(cpm);
      timeEl.textContent = `${Math.floor(elapsedMs / 1000)}s`;
    }

    function showXPToast(xp, message) {
      const existing = document.querySelector('.xp-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'xp-toast';
      toast.innerHTML = `⚡ +${xp} XP<div class="xp-sub">${esc(message)}</div>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3200);
    }

    async function claimXP() {
      if (rewardSent) return;
      rewardSent = true;

      const token = getAuthToken();
      if (!token) {
        setStatus("✅ PASSED (войди для XP)", "status-ok");
        return;
      }

      const accuracy = getAccuracy();
      const elapsedMs = startedAt ? Date.now() - startedAt : 0;
      const elapsedMin = elapsedMs > 0 ? (elapsedMs / 60000) : 0;
      const cpmVal = elapsedMin > 0 ? Math.round(targetText.length / elapsedMin) : 0;

      try {
        if (typingTelemetry) await typingTelemetry.flush(true);
        const telemetryCredentials = typingTelemetry
          ? typingTelemetry.credentials()
          : { typing_session_id: null, typing_receipt: null };
        const resp = await fetch(`${API_URL}/api/alextype/complete`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({
            level: levelEl.value,
            chars_typed: inputEl.value.length,
            accuracy: accuracy,
            text_length: targetText.length,
            cpm: cpmVal,
            elapsed_ms: elapsedMs,
            keystrokes: _keystrokeCount,
            ...telemetryCredentials,
          }),
        });
        const data = await resp.json();
        if (data.status === "integrity_penalty") {
          const penalty = Number(data.penalty_xp || 0);
          setStatus(`⛔ АВТОПЕЧАТЬ — штраф ${penalty} XP`, "status-bad");
        } else if (data.xp_awarded > 0) {
          showXPToast(data.xp_awarded, data.message || 'За набор текста');
          setStatus(`✅ PASSED +${data.xp_awarded} XP`, "status-ok");
        } else {
          setStatus(`✅ PASSED — ${data.message || ''}`, "status-ok");
        }
      } catch (e) {
        console.warn('AlexType XP claim failed:', e);
        setStatus("✅ PASSED", "status-ok");
      }
    }

    // ===== ANTI-CHEAT v3: Robust voice-input & paste protection =====
    //
    // Layer 1: Time-based keydown↔input correlation
    //   Records timestamp of each keydown. insertText is allowed only if a keydown
    //   occurred within the last 300ms. This is robust to any input method (IBus,
    //   Fcitx, XKB, XIM) because it doesn't require 1:1 keydown↔insertText matching.
    //   Voice input without real keydowns is caught; voice with synthetic keydowns
    //   is caught by Layer 2 (burst).
    //
    // Layer 2: Burst detection
    //   Voice input arrives in bursts (20-50+ chars in <100ms). Humans peak ~15 chars/sec.
    //   Track recent insert timestamps; if >15 chars arrive within 250ms → block.
    //
    // Layer 3: Multi-character insertText blocking
    //   Real keyboard always sends insertText with data.length === 1.
    //   Voice/autocomplete sends data.length > 1 → block (except during IME composition).
    //
    let _keystrokeCount = 0;            // Real keydown events (sent to server)
    let _lastKeydownTime = 0;           // Timestamp of last keydown (Layer 1)
    let _lastKeydownTrusted = false;     // Browser-generated (not dispatchEvent)
    let _inComposition = false;         // True during IME composition
    let _voiceBlockCount = 0;           // How many voice inserts were blocked
    const _recentInsertTimes = [];      // Timestamps of recent insertText events (Layer 2)
    const _KEYDOWN_WINDOW_MS = 300;     // Max time between keydown and insertText
    const _BURST_WINDOW_MS = 250;       // Burst detection window
    const _BURST_MAX_CHARS = 15;        // Max chars allowed in burst window

    // Kill browser Speech Recognition API
    try {
      window.SpeechRecognition = undefined;
      window.webkitSpeechRecognition = undefined;
      Object.defineProperty(window, 'SpeechRecognition', { value: undefined, writable: false, configurable: false });
      Object.defineProperty(window, 'webkitSpeechRecognition', { value: undefined, writable: false, configurable: false });
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (e) { }

    // IME composition tracking — composition input is always trusted (real keyboard)
    inputEl.addEventListener("compositionstart", () => { _inComposition = true; });
    inputEl.addEventListener("compositionend", () => {
      // Delay clearing _inComposition to handle all browser orderings:
      // Chrome: insertText fires BEFORE compositionend → _inComposition is true → passes
      // Firefox: insertText fires AFTER compositionend → needs this delay
      setTimeout(() => { _inComposition = false; }, 150);
    });

    // ===== CORE: beforeinput — block ALL non-keyboard inserts =====
    inputEl.addEventListener("beforeinput", (e) => {
      // Always block: paste, drop, yank, replacement, link, autocomplete
      const alwaysBlocked = [
        "insertFromPaste", "insertFromDrop", "insertFromYank",
        "insertReplacementText", "insertLink",
        "insertFromPasteAsQuotation",
      ];
      if (alwaysBlocked.includes(e.inputType)) {
        e.preventDefault();
        if (typingTelemetry) typingTelemetry.record("blocked", (e.data || "").length, false);
        setStatus("⛔ Вставка запрещена — печатай сам!", "status-bad");
        return;
      }

      // Skip ALL checks during active composition (IME input is trusted)
      if (_inComposition) {
        _pendingInputMeta = {
          kind: "composition",
          chars: Math.max(1, (e.data || "").length),
          trusted: Boolean(e.isTrusted),
        };
        return;
      }

      // For insertText: apply all three layers
      if (e.inputType === "insertText") {
        const now = Date.now();

        // Layer 3: Multi-character insertText = voice/autocomplete
        if (e.data && e.data.length > 1) {
          e.preventDefault();
          _voiceBlockCount++;
          if (typingTelemetry) typingTelemetry.record("blocked", e.data.length, false);
          setStatus("⛔ Голосовой ввод запрещён — печатай сам!", "status-bad");
          return;
        }

        // Layer 1: No recent keydown = no physical key press
        if (now - _lastKeydownTime > _KEYDOWN_WINDOW_MS) {
          e.preventDefault();
          _voiceBlockCount++;
          if (typingTelemetry) typingTelemetry.record("blocked", (e.data || "").length || 1, false);
          setStatus("⛔ Голосовой ввод запрещён — печатай сам!", "status-bad");
          return;
        }

        // Layer 2: Burst detection — too many chars too fast
        while (_recentInsertTimes.length > 0 && now - _recentInsertTimes[0] > _BURST_WINDOW_MS) {
          _recentInsertTimes.shift();
        }
        if (_recentInsertTimes.length >= _BURST_MAX_CHARS) {
          e.preventDefault();
          _voiceBlockCount++;
          if (typingTelemetry) typingTelemetry.record("blocked", (e.data || "").length || 1, false);
          setStatus("⛔ Голосовой ввод запрещён — печатай сам!", "status-bad");
          return;
        }

        // All checks passed — accept this character
        _recentInsertTimes.push(now);
        _pendingInputMeta = {
          kind: "insert",
          chars: Math.max(1, (e.data || "").length),
          trusted: Boolean(e.isTrusted && _lastKeydownTrusted),
        };
      } else if (String(e.inputType || "").startsWith("delete")) {
        _pendingInputMeta = {
          kind: "delete",
          chars: 1,
          trusted: Boolean(e.isTrusted && _lastKeydownTrusted),
        };
      }

      // Allow: insertCompositionText, deleteContent*, historyUndo/Redo
    });

    inputEl.addEventListener("keydown", (e) => {
      // Block clipboard shortcuts
      if ((e.ctrlKey || e.metaKey) && ["v", "c", "x", "a"].includes(e.key.toLowerCase())) {
        e.preventDefault();
        if (e.key.toLowerCase() === "v") {
          setStatus("⛔ Вставка запрещена — печатай сам!", "status-bad");
        }
        return;
      }
      // Don't count modifier-only keys or non-character keys
      if (["Shift", "Control", "Alt", "Meta", "CapsLock", "Tab", "Escape",
        "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
        "Home", "End", "PageUp", "PageDown",
        "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12"
      ].includes(e.key)) {
        return;
      }
      _keystrokeCount++;
      _lastKeydownTime = Date.now();
      _lastKeydownTrusted = Boolean(e.isTrusted);
    });

    inputEl.addEventListener("paste", (e) => {
      e.preventDefault();
      if (typingTelemetry) typingTelemetry.record("blocked", 1, false);
      setStatus("⛔ Вставка запрещена — печатай сам!", "status-bad");
    });

    inputEl.addEventListener("copy", (e) => { e.preventDefault(); });
    inputEl.addEventListener("cut", (e) => { e.preventDefault(); });
    inputEl.addEventListener("contextmenu", (e) => { e.preventDefault(); });

    // Block drag-and-drop text into textarea
    inputEl.addEventListener("drop", (e) => {
      e.preventDefault();
      if (typingTelemetry) typingTelemetry.record("blocked", 1, false);
      setStatus("⛔ Перетаскивание запрещено!", "status-bad");
    });

    inputEl.addEventListener("input", (event) => {
      const currentValue = inputEl.value;
      const delta = currentValue.length - _lastInputValue.length;
      const meta = _pendingInputMeta;
      if (meta) {
        const observedChars = meta.kind === "delete"
          ? Math.max(1, -delta, meta.chars || 0)
          : Math.max(1, delta, meta.chars || 0);
        if (typingTelemetry) {
          typingTelemetry.record(
            meta.kind,
            observedChars,
            Boolean(meta.trusted && event.isTrusted),
          );
        }
      } else if (delta > 0) {
        // An input event with no accepted beforeinput/keydown path is a strong
        // automation signal.  Synthetic events have isTrusted=false.
        if (typingTelemetry) typingTelemetry.record("programmatic", delta, false);
      } else if (delta < 0) {
        if (typingTelemetry) typingTelemetry.record("delete", -delta, Boolean(event.isTrusted));
      }
      _pendingInputMeta = null;
      _lastInputValue = currentValue;

      // Standard input handler
      if (!startedAt && inputEl.value.length > 0) {
        startedAt = Date.now();
        timer = setInterval(setStats, 200);
      }
      renderSample();
      setStats();

      if (inputEl.value === targetText) {
        clearInterval(timer);
        timer = null;
        claimXP();
      } else if (inputEl.value.length >= targetText.length) {
        setStatus("❌ FAILED", "status-bad");
      } else {
        setStatus("⏳ В процессе...", "");
      }
    });

    document.getElementById("newText").addEventListener("click", pickText);
    document.getElementById("reset").addEventListener("click", pickText);
    levelEl.addEventListener("change", pickText);
    langEl.addEventListener("change", pickText);

    // ===== HEARTBEAT: Track alextype time =====
    (function startAlexTypeHeartbeat() {
      const token = getAuthToken();
      if (!token) return;
      const sendBeat = () => {
        fetch(`${API_URL}/api/heartbeat`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ context: 'alextype' })
        }).catch(() => { });
      };
      sendBeat();
      setInterval(sendBeat, 30000);
    })();

    pickText();
  </script>
</body>
