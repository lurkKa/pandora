<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Квиз — Академия Pandora</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--border:rgba(255,255,255,0.08);--accent:#8b5cf6;--accent2:#6366f1;
--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;
--text:#e2e8f0;--text2:rgba(255,255,255,0.5)}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hidden{display:none!important}

/* Header */
.quiz-header{position:fixed;top:0;left:0;right:0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid var(--border)}
.quiz-header .logo{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.quiz-header .back-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;transition:all .2s}
.quiz-header .back-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}

/* Views */
.view{width:100%;max-width:700px;padding:80px 20px 40px;margin:0 auto}

/* Menu */
.menu-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;text-align:center}
.menu-card h1{font-size:36px;margin-bottom:8px}
.menu-card p{color:var(--text2);margin-bottom:32px;font-size:15px}
.menu-actions{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:0 auto}
.btn{padding:14px 24px;border-radius:14px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,0.3)}
.btn-secondary{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:16px;text-align:center;letter-spacing:4px;text-transform:uppercase;font-weight:700}
.join-row input::placeholder{letter-spacing:1px;font-weight:400;color:var(--text2)}
.daily-info{margin-top:20px;font-size:13px;color:var(--text2);padding:12px;background:rgba(255,255,255,0.03);border-radius:12px}

/* Lobby */
.lobby-code{font-size:48px;font-weight:800;letter-spacing:8px;color:var(--accent);margin:20px 0;font-family:monospace}
.lobby-status{color:var(--orange);font-size:14px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.lobby-status .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.participants-list{text-align:left;margin:20px 0}
.participant-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}
.participant-item .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-size:18px}
.participant-item .name{flex:1;font-weight:600;font-size:14px}
.participant-item .badge{font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(139,92,246,0.15);color:var(--accent)}

/* Question */
#view-question{display:flex;flex-direction:column;align-items:center;padding-top:80px}
.q-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%;max-width:600px}
.q-progress .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden}
.q-progress .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .4s}
.q-progress .label{font-size:13px;color:var(--text2);white-space:nowrap}
.q-timer{font-size:48px;font-weight:800;margin-bottom:12px;transition:color .3s}
.q-timer.urgent{color:var(--red);animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.q-domain{font-size:12px;padding:4px 12px;border-radius:8px;background:rgba(139,92,246,0.12);color:var(--accent);margin-bottom:16px;display:inline-block}
.q-text{font-size:20px;font-weight:600;text-align:center;max-width:600px;line-height:1.5;margin-bottom:28px;min-height:60px}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:600px}
.opt-btn{padding:20px 16px;border-radius:16px;border:2px solid transparent;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;min-height:70px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.opt-btn:nth-child(1){background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);color:#fca5a5}
.opt-btn:nth-child(2){background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.3);color:#93c5fd}
.opt-btn:nth-child(3){background:rgba(245,158,11,0.15);border-color:rgba(245,158,11,0.3);color:#fcd34d}
.opt-btn:nth-child(4){background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.3);color:#86efac}
.opt-btn:hover{transform:scale(1.03);filter:brightness(1.2)}
.opt-btn.selected{border-width:3px;transform:scale(1.05)}
.opt-btn.correct{background:rgba(34,197,94,0.3)!important;border-color:var(--green)!important}
.opt-btn.wrong{background:rgba(239,68,68,0.3)!important;border-color:var(--red)!important;opacity:0.6}
.opt-btn:disabled{cursor:default;transform:none!important;filter:none!important}

/* Feedback */
.feedback-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;text-align:center;width:100%;max-width:500px;margin-top:20px}
.feedback-card .icon{font-size:56px;margin-bottom:12px}
.feedback-card .points{font-size:28px;font-weight:700;margin:8px 0}
.feedback-card .explain{color:var(--text2);font-size:13px;margin-top:12px;line-height:1.5}
.waiting-others{margin-top:16px;color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.ready-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ready-chip{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600}
.ready-chip.yes{background:rgba(34,197,94,0.15);color:var(--green)}
.ready-chip.no{background:rgba(255,255,255,0.05);color:var(--text2)}

/* Results */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:24px 0 32px}
.podium-col{text-align:center;border-radius:16px 16px 0 0;padding:16px 20px;min-width:100px}
.podium-col.first{background:linear-gradient(180deg,rgba(251,191,36,0.2),rgba(251,191,36,0.05));border:1px solid rgba(251,191,36,0.3);min-height:160px}
.podium-col.second{background:linear-gradient(180deg,rgba(156,163,175,0.2),rgba(156,163,175,0.05));border:1px solid rgba(156,163,175,0.3);min-height:120px}
.podium-col.third{background:linear-gradient(180deg,rgba(180,83,9,0.2),rgba(180,83,9,0.05));border:1px solid rgba(180,83,9,0.3);min-height:90px}
.podium-col .medal{font-size:32px}
.podium-col .pname{font-weight:700;font-size:14px;margin:6px 0}
.podium-col .pscore{font-size:12px;color:var(--text2)}
.podium-col .pxp{font-size:13px;color:var(--green);font-weight:600;margin-top:4px}
.results-table{width:100%;border-collapse:collapse;margin-top:16px}
.results-table th,.results-table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.results-table th{color:var(--text2);font-weight:600}
.results-table tr:hover td{background:rgba(255,255,255,0.02)}

@media(max-width:600px){
  .options-grid{grid-template-columns:1fr}
  .q-text{font-size:17px}
  .lobby-code{font-size:36px;letter-spacing:5px}
  .podium-col{min-width:80px;padding:12px}
  .podium{gap:8px}
}
</style>
</head>
<body>

<div class="quiz-header">
  <div class="logo">🧠 Квиз</div>
  <button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<!-- MENU -->
<div id="view-menu" class="view">
  <div class="menu-card">
    <h1>🧠 Квиз</h1>
    <p>Соревнуйся с друзьями! 12-15 вопросов, реальный XP.</p>
    <div class="menu-actions">
      <button class="btn btn-primary" onclick="createLobby()" id="btn-create">🎮 Создать лобби</button>
      <div class="join-row">
        <input type="text" id="join-code" placeholder="КОД" maxlength="6">
        <button class="btn btn-secondary" onclick="joinLobby()">Войти</button>
      </div>
    </div>
    <div class="daily-info" id="daily-info">Загрузка...</div>
  </div>
</div>

<!-- LOBBY -->
<div id="view-lobby" class="view hidden">
  <div class="menu-card">
    <h1>🎮 Лобби</h1>
    <div class="lobby-code" id="lobby-code">------</div>
    <div class="lobby-status"><span class="dot"></span> <span id="lobby-status-text">Ожидание одобрения админа...</span></div>
    <div class="participants-list" id="lobby-participants"></div>
    <button class="btn btn-secondary" onclick="leaveLobby()" style="margin-top:16px">Покинуть</button>
  </div>
</div>

<!-- QUESTION -->
<div id="view-question" class="view hidden">
  <div class="q-progress">
    <span class="label" id="q-counter">1/12</span>
    <div class="bar"><div class="bar-fill" id="q-bar" style="width:0%"></div></div>
  </div>
  <div class="q-timer" id="q-timer">20</div>
  <div class="q-domain" id="q-domain">Python</div>
  <div class="q-text" id="q-text">Загрузка вопроса...</div>
  <div class="options-grid" id="q-options"></div>
</div>

<!-- FEEDBACK -->
<div id="view-feedback" class="view hidden" style="display:flex;flex-direction:column;align-items:center;padding-top:100px">
  <div class="feedback-card">
    <div class="icon" id="fb-icon">✅</div>
    <div class="points" id="fb-points">+150</div>
    <div id="fb-score" style="color:var(--text2);font-size:14px">Всего: 450 очков</div>
    <div class="explain" id="fb-explain"></div>
  </div>
  <div style="margin-top:20px;width:100%;max-width:500px">
    <button class="btn btn-primary" onclick="sendReady()" id="btn-ready" style="width:100%">✅ Готов к следующему!</button>
    <div class="ready-list" id="ready-list"></div>
    <div class="waiting-others" id="waiting-msg"><span class="dot"></span> Ожидание остальных...</div>
  </div>
</div>

<!-- RESULTS -->
<div id="view-results" class="view hidden">
  <div class="menu-card" style="padding:32px 24px">
    <h1 style="font-size:28px;margin-bottom:4px">🏆 Результаты</h1>
    <p style="margin-bottom:24px">Квиз завершён!</p>
    <div class="podium" id="podium"></div>
    <table class="results-table" id="results-table">
      <thead><tr><th>#</th><th>Игрок</th><th>Верно</th><th>Очки</th><th>XP</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
    <button class="btn btn-primary" onclick="goBack()" style="width:100%;margin-top:24px">🏠 Вернуться</button>
  </div>
</div>

<script>
const API_URL = location.origin;
const authToken = localStorage.getItem('auth_token');
if (!authToken) { location.href = '/'; }

let currentCode = null;
let pollTimer = null;
let countdownTimer = null;
let questionStartTime = 0;
let answered = false;

function show(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById(viewId).classList.remove('hidden');
}

function goBack() {
  if (pollTimer) clearInterval(pollTimer);
  if (countdownTimer) clearInterval(countdownTimer);
  location.href = '/';
}

async function api(endpoint, method = 'GET', body = null) {
  const opts = { method, headers: { 'Authorization': `Bearer ${authToken}` } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(`${API_URL}${endpoint}`, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

// ── Menu ──
async function loadDailyInfo() {
  try {
    const d = await api('/api/quiz/daily-info');
    document.getElementById('daily-info').innerHTML =
      `Сегодня: ${d.daily_count}/${d.daily_limit} квизов` +
      (d.daily_count >= d.daily_limit ? ' <span style="color:var(--red)">· Лимит исчерпан</span>' : '') +
      (!d.quiz_available ? ' <span style="color:var(--red)">· База вопросов не загружена</span>' : '');
    document.getElementById('btn-create').disabled = d.daily_count >= d.daily_limit || !d.quiz_available;
  } catch(e) { document.getElementById('daily-info').textContent = 'Ошибка загрузки'; }
}

// ── Create / Join ──
async function createLobby() {
  try {
    const d = await api('/api/quiz/create', 'POST');
    currentCode = d.code;
    show('view-lobby');
    document.getElementById('lobby-code').textContent = d.code;
    startPolling();
  } catch(e) { alert(e.message); }
}

async function joinLobby() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  if (!code || code.length !== 6) { alert('Введите 6-значный код'); return; }
  try {
    await api('/api/quiz/join', 'POST', { code });
    currentCode = code;
    show('view-lobby');
    document.getElementById('lobby-code').textContent = code;
    startPolling();
  } catch(e) { alert(e.message); }
}

async function leaveLobby() {
  if (!currentCode) return;
  try { await api(`/api/quiz/leave/${currentCode}`, 'POST'); } catch(e) {}
  stopPolling();
  currentCode = null;
  show('view-menu');
  loadDailyInfo();
}

// ── Polling ──
function startPolling() { stopPolling(); pollTimer = setInterval(pollSession, 2000); pollSession(); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

let lastStatus = '';
async function pollSession() {
  if (!currentCode) return;
  try {
    const s = await api(`/api/quiz/session/${currentCode}`);
    if (s.status === 'expired') { stopPolling(); alert('Сессия истекла'); show('view-menu'); loadDailyInfo(); return; }

    if (s.status === 'lobby' || s.status === 'approved') {
      renderLobby(s);
      if (lastStatus !== 'lobby') show('view-lobby');
      lastStatus = 'lobby';
    } else if (s.status === 'active') {
      if (s.my_answered && lastStatus === 'question') {
        renderFeedback(s);
        lastStatus = 'feedback';
      } else if (!s.my_answered) {
        if (lastStatus !== 'question' || s.current_question !== window._lastQI) {
          renderQuestion(s);
          lastStatus = 'question';
        }
      } else {
        renderFeedback(s);
        if (lastStatus !== 'feedback') lastStatus = 'feedback';
      }
    } else if (s.status === 'finished') {
      stopPolling();
      renderResults(s);
      show('view-results');
      lastStatus = 'finished';
    }
  } catch(e) { console.error('Poll error:', e); }
}

// ── Lobby ──
function renderLobby(s) {
  document.getElementById('lobby-code').textContent = s.code;
  const statusText = s.status === 'approved' ? 'Одобрено! Начинаем...' : 'Ожидание одобрения админа...';
  document.getElementById('lobby-status-text').textContent = statusText + ` (${s.participant_count} игроков)`;
  const list = document.getElementById('lobby-participants');
  list.innerHTML = s.participants.map((p, i) => `
    <div class="participant-item">
      <div class="avatar">🧙</div>
      <div class="name">${p.display_name}</div>
      ${p.user_id === s.creator_id ? '<div class="badge">Создатель</div>' : ''}
    </div>
  `).join('');
}

// ── Question ──
window._lastQI = -1;
function renderQuestion(s) {
  if (!s.question) return;
  const q = s.question;
  window._lastQI = q.index;
  answered = false;
  show('view-question');

  document.getElementById('q-counter').textContent = `${q.index + 1}/${s.total_questions}`;
  document.getElementById('q-bar').style.width = `${((q.index) / s.total_questions) * 100}%`;
  const domainMap = {python:'🐍 Python', javascript:'⚡ JavaScript', frontend:'🎨 Frontend', scratch:'🐱 Scratch'};
  document.getElementById('q-domain').textContent = domainMap[q.domain] || q.domain;
  document.getElementById('q-text').textContent = q.question;

  const grid = document.getElementById('q-options');
  grid.innerHTML = q.options.map((o, i) => `
    <button class="opt-btn" onclick="submitAnswer(${i})" id="opt-${i}">${o.text || o}</button>
  `).join('');

  questionStartTime = Date.now();
  startCountdown(q.time_limit_sec || 20);
}

function startCountdown(seconds) {
  if (countdownTimer) clearInterval(countdownTimer);
  let remaining = seconds;
  const el = document.getElementById('q-timer');
  el.textContent = remaining;
  el.classList.remove('urgent');

  countdownTimer = setInterval(() => {
    remaining--;
    el.textContent = Math.max(0, remaining);
    if (remaining <= 5) el.classList.add('urgent');
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      if (!answered) submitAnswer(-1); // auto-skip
    }
  }, 1000);
}

async function submitAnswer(idx) {
  if (answered) return;
  answered = true;
  if (countdownTimer) clearInterval(countdownTimer);

  const timeMs = Date.now() - questionStartTime;

  // Disable all buttons, highlight selected
  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === idx) b.classList.add('selected');
  });

  try {
    const d = await api(`/api/quiz/answer/${currentCode}`, 'POST', { answer_index: idx, time_ms: timeMs });
    // Show correct/wrong on buttons
    document.querySelectorAll('.opt-btn').forEach((b, i) => {
      if (i === d.correct_index) b.classList.add('correct');
      else if (i === idx && !d.status.includes('correct')) b.classList.add('wrong');
    });

    // Store feedback data
    window._lastFeedback = d;
    // Transition to feedback after brief delay
    setTimeout(() => pollSession(), 1000);
  } catch(e) { console.error('Answer error:', e); }
}

// ── Feedback ──
function renderFeedback(s) {
  show('view-feedback');
  const fb = window._lastFeedback || {};
  const isCorrect = fb.status === 'correct';
  document.getElementById('fb-icon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('fb-points').textContent = `+${fb.points_earned || 0} очков`;
  document.getElementById('fb-points').style.color = isCorrect ? 'var(--green)' : 'var(--red)';
  document.getElementById('fb-score').textContent = `Всего: ${s.my_score || fb.total_score || 0} очков`;
  document.getElementById('fb-explain').textContent = fb.explanation || '';

  // Ready button state
  const btn = document.getElementById('btn-ready');
  btn.disabled = s.my_ready;
  btn.textContent = s.my_ready ? '⏳ Ожидание...' : '✅ Готов к следующему!';

  // Ready list
  const list = document.getElementById('ready-list');
  list.innerHTML = s.participants.map(p =>
    `<span class="ready-chip ${p.is_ready ? 'yes' : 'no'}">${p.is_ready ? '✅' : '⏳'} ${p.display_name}</span>`
  ).join('');
}

async function sendReady() {
  if (!currentCode) return;
  try {
    const d = await api(`/api/quiz/ready/${currentCode}`, 'POST');
    document.getElementById('btn-ready').disabled = true;
    document.getElementById('btn-ready').textContent = '⏳ Ожидание...';
  } catch(e) { console.error(e); }
}

// ── Results ──
function renderResults(s) {
  const results = s.final_results || s.participants.sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];

  // Podium (reorder: 2nd, 1st, 3rd)
  const podium = document.getElementById('podium');
  const order = [1, 0, 2]; // display order
  podium.innerHTML = order.map(i => {
    const p = results[i];
    if (!p) return '';
    const cls = i === 0 ? 'first' : i === 1 ? 'second' : 'third';
    return `<div class="podium-col ${cls}">
      <div class="medal">${medals[i] || ''}</div>
      <div class="pname">${p.display_name}</div>
      <div class="pscore">${p.score} очков</div>
      <div class="pxp">+${p.xp_earned} XP</div>
    </div>`;
  }).join('');

  // Full table
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = results.map((p, i) => `
    <tr${i === 0 ? ' style="color:var(--orange);font-weight:700"' : ''}>
      <td>${medals[i] || (i+1)}</td>
      <td>${p.display_name}</td>
      <td>${p.correct_count || 0}</td>
      <td>${p.score}</td>
      <td style="color:var(--green);font-weight:600">+${p.xp_earned}</td>
    </tr>
  `).join('');
}

// ── Init ──
loadDailyInfo();
</script>
</body>
</html>
